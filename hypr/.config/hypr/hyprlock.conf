# Minimal Everforest-inspired Hyprlock
# Standalone configuration: no theme-switcher or generated palette dependencies.

$bg = rgba(2d353bff)
$text = rgba(d3c6aaff)
$green = rgba(a7c080ff)
$surface = rgba(475258ff)
$red = rgba(e67e80ff)
$yellow = rgba(dbbc7fff)
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = $bg
}

# Large stacked clock: hours on the first row, minutes on the second.
label {
    monitor =
    text = cmd[update:1000] date +%H
    color = $green
    font_size = 180
    font_family = $font
    position = 0, -105
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +%M
    color = $green
    font_size = 180
    font_family = $font
    position = 0, 75
    halign = center
    valign = center
}

# Date beneath the clock.
label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = $text
    font_size = 24
    font_family = $font
    position = 0, 220
    halign = center
    valign = center
}

# Square password field with Everforest green accent.
input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = $green
    inner_color = $surface
    font_color = $text
    fade_on_empty = false
    rounding = 0
    placeholder_text = 󰌾  Enter password
    hide_input = false
    check_color = $green
    fail_color = $red
    fail_text = $FAIL ($ATTEMPTS)
    capslock_color = $yellow
    font_family = $font
    position = 0, 340
    halign = center
    valign = center
}
