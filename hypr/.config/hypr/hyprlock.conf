# Hyprlock configuration
# Colors are generated by theme-switch from the selected theme.
source = $HOME/.config/theme-switcher/active/hyprlock-colors.conf

$accent = $mauve
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

# Use the current desktop as the background, softened with blur.
background {
    monitor =
    path = screenshot
    blur_passes = 2
    color = $base
}

# TIME
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%R")"
    color = $text
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = $text
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# PASSWORD INPUT
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    rounding = 0
    placeholder_text = 󰌾  Logged in as $USER
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = $FAIL ($ATTEMPTS)
    capslock_color = $yellow
    font_family = $font
    position = 0, -35
    halign = center
    valign = center
}
