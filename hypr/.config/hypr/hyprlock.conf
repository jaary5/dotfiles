# theme-switch copies the selected theme's palette into the active runtime directory.

source = $HOME/.config/theme-switcher/active/hyprlock-colors.conf

# $font = JetBrainsMono Nerd Font
$font = CaskaydiaCove Nerd Font

general {
    hide_cursor = true
    ignore_empty = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = $base
}

# Large stacked clock: hours above minutes.
label {
    monitor =
    # text = cmd[update:1000] date +%H    # 24 hour format
    text = cmd[update:1000] date +%I    # 12 hour format
    # position = 0, 75      # Laptop
    position = 0, 45        # PC
    color = $accent
    font_size = 180
    font_family = $font
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +%M
    # position = 0, -105    # Laptop
    position = 0, -165      # PC
    color = $accent
    font_size = 180
    font_family = $font
    halign = center
    valign = center
}

# Date beneath the clock.
label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = $text
    font_size = 24
    font_family = $font
    position = 0, 220
    halign = center
    valign = center
}

# Password field uses the selected theme's surface and accent colors.
input-field {
    monitor =
    size = 320, 58
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    rounding = 0
    placeholder_text = 󰌾  Enter password
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = $FAIL ($ATTEMPTS)
    capslock_color = $yellow
    font_family = $font
    position = 0, 340
    halign = center
    valign = center
}
