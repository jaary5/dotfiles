# ========================================
# MPV Configuration
# ========================================
# Time (milliseconds) that on-screen messages remain visible.
# Increase if you want OSD messages to stay longer.
osd-duration=150

# ========================================
# Initial Window Size
# ========================================
# Open every video in a 960x540 window.
# Change these numbers if you want the window larger or smaller.
#
# Examples:
#   800x450   -> Smaller
#   960x540   -> Medium (recommended)
#   1200x675  -> Large
geometry=960x540+50%+50%

# Position the window.
#
# +50%+50% = Center of the screen
# +0+0     = Top-left corner
# -0+0     = Top-right corner
# +0-0     = Bottom-left corner
# -0-0     = Bottom-right corner

# Keep the window at the specified geometry instead of resizing
# to match the video's aspect ratio.
#
# yes = Window shape changes to match video aspect ratio.
# no  = Window keeps the size set by 'geometry'.
keepaspect-window=yes

